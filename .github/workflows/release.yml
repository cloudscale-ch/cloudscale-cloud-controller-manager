name: Release

permissions: {}

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write          # gh release create
      id-token: write          # keyless cosign + actions/attest OIDC (Fulcio/Rekor)
      attestations: write      # actions/attest — persist attestations
      artifact-metadata: write # actions/attest — create the artifact storage record
    name: Build and publish release
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      IMG_REPO: quay.io/cloudscalech/cloudscale-cloud-controller-manager
      IMG: quay.io/cloudscalech/cloudscale-cloud-controller-manager:${{ github.ref_name }}
      # Keyless Sigstore signing identity
      ID_REGEXP: '^https://github.com/cloudscale-ch/cloudscale-cloud-controller-manager/\.github/workflows/release\.yml@refs/tags/'
      ISSUER: https://token.actions.githubusercontent.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # Gate the release on reachable vulnerabilities (incl. stdlib/toolchain)
      # before we build or push anything.
      - name: Run govulncheck
        run: make govulncheck

      # The tag is baked into the binary as its version; make sure the
      # binary still starts with it before anything is published.
      - name: Smoke-test the binary with the release version
        run: |
          make build VERSION="$TAG"
          ./bin/cloudscale-cloud-controller-manager --version

      - name: Login to quay.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMG }}
          build-args: |
            VERSION=${{ env.TAG }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          # We attach our own SLSA provenance + SBOM attestations below with
          # actions/attest; disable BuildKit's inline provenance so the image
          # index stays clean and single-sourced.
          provenance: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless signature (Sigstore/OIDC) — verifiable with `cosign verify`.
      - name: Sign the container image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMG_REPO}@${DIGEST}"

      # Verify the signature we just created.
      - name: Verify the container image signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${IMG_REPO}@${DIGEST}" \
            --certificate-identity-regexp "$ID_REGEXP" \
            --certificate-oidc-issuer "$ISSUER"

      # SLSA build provenance attestation, pushed to quay and the GitHub
      # attestation store (verifiable with `gh attestation verify`).
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMG_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # Verify the provenance attestation we just pushed.
      - name: Verify build provenance attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMG_REPO}@${DIGEST}" --owner cloudscale-ch \
            --predicate-type https://slsa.dev/provenance/v1

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMG_REPO }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # SBOM attestation (the same action switches to SBOM mode when sbom-path
      # is set), pushed to quay and the GitHub attestation store.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMG_REPO }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      # Verify the SBOM attestation we just pushed.
      - name: Verify SBOM attestation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh attestation verify "oci://${IMG_REPO}@${DIGEST}" --owner cloudscale-ch \
            --predicate-type https://spdx.dev/Document/v2.3

      # Install manifest attached to the release. The README installs from
      # releases/latest/download/config.yml, so every release must have it.
      - name: Render install manifest
        run: |
          sed "s|:latest|:${TAG}|" deploy/latest.yml > config.yml
          grep -q "cloudscale-cloud-controller-manager:${TAG}$" config.yml

      # Backports and pre-releases must neither become the "Latest" GitHub
      # release nor move :latest, so both depend on this check.
      - name: Check if this is the highest version
        id: version
        run: |
          HIGHEST=$(git tag -l '[0-9]*.*.*' --sort=-v:refname | grep -v -- '-' | head -n1)
          if [[ "$TAG" == "$HIGHEST" ]]; then
            echo "highest=true" >> "$GITHUB_OUTPUT"
          else
            echo "highest=false" >> "$GITHUB_OUTPUT"
            echo "$TAG is not the highest full release, $HIGHEST is"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: https://github.com/${{ github.repository }}
          IS_HIGHEST: ${{ steps.version.outputs.highest }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES=$(cat <<EOF
          ## Configuration

          This release can be installed with the following command:

          \`\`\`
          kubectl apply -f ${REPO_URL}/releases/download/${TAG}/config.yml
          \`\`\`

          Please refer to the [README](${REPO_URL}/blob/${TAG}/README.md) for detailed instructions.
          EOF
          )
          gh release create "$TAG" \
            --generate-notes \
            --notes "$NOTES" \
            --latest="$IS_HIGHEST" \
            $PRERELEASE_FLAG \
            sbom.spdx.json \
            config.yml

      # Runs last, so :latest only ever points at a verified image with a
      # published release. Moved only for full releases with the highest
      # version, so a backport release does not replace a newer image.
      - name: Tag image as latest
        if: ${{ !contains(github.ref_name, '-') && steps.version.outputs.highest == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create -t "${IMG_REPO}:latest" "${IMG_REPO}@${DIGEST}"
